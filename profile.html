<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - VIDYA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="css/profile.css">
</head>
<body>

<div class="profile-container">
    <div class="header-section">
        <h2>Edit Profile</h2>
    </div>

    <div id="msg"></div>

    <form id="profileForm">
        <div class="form-grid">
            
            <div class="form-row">
                <label>First Name</label>
                <input id="firstName" type="text" placeholder="Your Name">
            </div>

            <div class="form-row">
                <label>Last Name</label>
                <input id="lastName" type="text" placeholder="Surname">
            </div>

            <div class="form-row full-width">
                <label>Email Address</label>
                <input id="email" type="email" disabled title="Email cannot be changed">
                <small style="color: #94a3b8; font-size: 12px;">Registered email cannot be changed.</small>
            </div>

            <div class="form-row">
                <label for="University">University</label>
                <select id="University">
                    <option value="">-- Select University --</option>
                    <option value="University of Calicut">University of Calicut</option>
                    <option value="APJ Abdul Kalam Technological University">APJ Abdul Kalam Technological University</option>
                    <option value="University of Kerala">University of Kerala</option>
                    <option value="Mahatma Gandhi University">Mahatma Gandhi University</option>
                    <option value="Cochin University of Science & Technology">Cochin University of Science & Technology</option>
                    <option value="Kannur University">Kannur University</option>
                </select>
            </div>

            <div class="form-row">
                <label for="institutionType">Institution Type</label>
                <select id="institutionType">
                    <option value="">-- Select Type --</option>
                    <option value="Government">Government</option>
                    <option value="Private">Private</option>
                    <option value="Aided">Aided</option>
                    <option value="Autonomous">Autonomous</option>
                </select>
            </div>

            <div class="form-row">
                <label for="stream">Stream</label>
                <select id="stream">
                    <option value="">-- Select stream --</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Management">Management</option>
                    <option value="Medical">Medical</option>
                    <option value="Commerce">Commerce</option>
                    <option value="Arts">Arts</option>
                </select>
            </div>

            <div class="form-row">
                <label for="degree">Programme</label>
                <select id="degree">
                    <option value="">-- Select --</option>
                    <option value="B.Tech">B.Tech</option>
                    <option value="BBA">BBA</option>
                    <option value="BCA">BCA</option>
                    <option value="MBA">MBA</option>
                    <option value="MBBS">MBBS</option>
                    <option value="B.Com">B.Com</option>
                </select>
            </div>

            <div class="form-row ">
                <label for="location">Preferred District</label>
                <select id="location">
                    
                    <option value="" disabled selected>-- Select District --</option>
                    <option value="Alappuzha">Alappuzha</option>
                    <option value="Ernakulam">Ernakulam</option>
                    <option value="Idukki">Idukki</option>
                    <option value="Kannur">Kannur</option>
                    <option value="Kasaragod">Kasaragod</option>
                    <option value="Kollam">Kollam</option>
                    <option value="Kottayam">Kottayam</option>
                    <option value="Kozhikode">Kozhikode</option>
                    <option value="Malappuram">Malappuram</option>
                    <option value="Palakkad">Palakkad</option>
                    <option value="Pathanamthitta">Pathanamthitta</option>
                    <option value="Thiruvananthapuram">Thiruvananthapuram</option>
                    <option value="Thrissur">Thrissur</option>
                    <option value="Wayanad">Wayanad</option>
                </select>
            </div>

        </div>

        <div class="btn-container">
            <button class="btn" type="submit" id="saveBtn">Update Profile</button>
            <a href="index.html" style="color: #64748b; text-decoration: none;">Cancel</a>
        </div>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- Firebase Config ---
    const firebaseConfig = {
      apiKey: "AIzaSyBt5DvViwm5ls_B4CWKYIYhMutJJ9opw_Y",
      authDomain: "vidyaproject-c4a1d.firebaseapp.com",
      projectId: "vidyaproject-c4a1d",
      storageBucket: "vidyaproject-c4a1d.firebasestorage.app",
      messagingSenderId: "637214484165",
      appId: "1:637214484165:web:f23e84c08cd6069f6fb2ac",
      measurementId: "G-647MPHBDGW"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    const msgBox = document.getElementById('msg');

    // 1. Check Login & Load Data
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            loadData(user);
        } else {
            console.log("No user found yet...");
        }
    });

    // 2. Load Function
    async function loadData(user) {
        try {
            document.getElementById('email').value = user.email || '';

            const docRef = doc(db, "users", user.uid);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                const setVal = (id, val) => { if(val) document.getElementById(id).value = val; };
                
                setVal('firstName', data.firstName || (data.name ? data.name.split(' ')[0] : ''));
                setVal('lastName', data.lastName || (data.name ? data.name.split(' ')[1] : ''));
                setVal('University', data.university);
                setVal('institutionType', data.institutionType); // NEW: Load Institution Type
                setVal('stream', data.stream);
                setVal('degree', data.degree);
                setVal('location', data.location);
            }
        } catch (error) {
            console.error("Error loading profile:", error);
        }
    }

    // 3. Save Function
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('saveBtn');
        btn.innerText = "Saving...";
        btn.disabled = true;
        
        msgBox.style.display = 'none';
        msgBox.className = '';

        if (!currentUser) {
            msgBox.innerText = "Error: You are not logged in.";
            msgBox.className = 'error';

            msgBox.style.display = 'block';
            return;
        }

        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const fullName = `${firstName} ${lastName}`.trim();

        const userData = {
            name: fullName,
            firstName: firstName,
            lastName: lastName,
            email: currentUser.email, 
            university: document.getElementById('University').value,
            institutionType: document.getElementById('institutionType').value, // NEW: Save Institution Type
            stream: document.getElementById('stream').value,
            degree: document.getElementById('degree').value,
            location: document.getElementById('location').value,
            updatedAt: new Date()
        };

        try {
            await setDoc(doc(db, "users", currentUser.uid), userData, { merge: true });

            msgBox.innerText = "Profile Updated Successfully! Redirecting...";
            msgBox.className = 'success';
            msgBox.style.display = 'block';
            
            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);

        } catch (error) {
            console.error("Update Error:", error);
            msgBox.innerText = "Error: " + error.message;
            msgBox.className = 'error';
            msgBox.style.display = 'block';
            
            btn.innerText = "Update Profile";
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
